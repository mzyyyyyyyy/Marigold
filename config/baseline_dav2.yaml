base_config:
- config/logging.yaml

wandb:
  project: marigold
  name: baseline_dav2

# Dataset config – same input_dir/output_dir/patch_coord as sr_fm_refiner_v5*
# so this baseline trains/validates/tests on the exact same patches for a
# fair comparison. Only 3 Landsat bands (p50) are used, matching the SR
# experiments' input channels (ls_da.yaml originally used 7 bands).
dataset:
  input_dir: "/mnt/data/data/Landsat/eur_test2/2019"
  input_dir_hr: "/mnt/data/data/PlanetScope/EUR_crop_area_test2_ResizeMultimodal"
  output_dir: "/mnt/data/dataset/CHM_EUR_3m_area_test2_ls"

  file_type_input: "jp2"
  file_type_output: "tif"
  target_name: "canopy_height_"
  year: 2019

  selected_bands: [0, 1, 2]
  selected_percentile: ["p50"]

  # unused by this baseline (no PS/HR input) but required by LazyPatchDataset
  selected_bands_hr: [2, 1, 0]

  use_input_minmax: True
  use_input_norm: False
  input_stats_file: "/mnt/data/dataset/CHM_EUR/LS_test2_statistics.json"

  use_input_hr_minmax: True
  use_input_hr_norm: False
  input_hr_stats_file: "/mnt/data/dataset/CHM_EUR/PS_test2_statistics.json"

  # Baseline predicts raw canopy height (meters) directly, matching
  # mono_regression/ls_da.yaml (normalize_target=False, minmax_target=False).
  use_target_minmax: False
  use_target_norm: False
  target_stats_file: "/mnt/data/dataset/CHM_EUR/EUR_CHM_test_statistics.json"

  scale_input_to_neg1_1: True
  scale_input_hr_to_neg1_1: True
  scale_target_to_neg1_1: False

  patch_sizes: [240, 480]
  num_patches_per_tile: 300000

  target_range_edges: [0, 5, 10, 15, 20, 25, 30]
  num_patches_per_target_range: 500

  tile_emphasis: []
  min_valid_ratio: 0.1
  train_split: 0.6
  val_split: 0.2
  test_split: 0.2
  split_seed: 42

  workers: 6
  # Same patch_coord as sr_fm_refiner_v5* → identical train/val/test split.
  patch_coord_path: "/mnt/data/dataset/CHM_EUR_marigold/train_patch_coord/save_20260609.pkl"

  correlation_cleaning: False
  unit_scale_ratio: 1


# Model – ported from mono_regression/models/depth_anything.py::DepthAnythingV2Height
model:
  backbone: "depth-anything/Depth-Anything-V2-Base-hf"
  pretrained: True
  out_in_scale_factor: 1


# Optimizer – values from mono_regression/configs_eur_ppt/ls_da.yaml (training block)
optimizer:
  lr: 2.0e-04
  weight_decay: 3.0e-04


# LR scheduler (cosine annealing, shared T_max = max_iter) – same convention
# as the rest of the project (sr_fm_refiner*/fm_refiner*), no warmup.
lr_scheduler:
  eta_min: 1.0e-07


# Dataloader – effective_batch_size == max_train_batch_size == 32 means no
# gradient accumulation: every batch is a real batch_size=32 step, matching
# ls_da.yaml's batch_size=32 directly. Lower both together if you hit OOM.
dataloader:
  effective_batch_size: 32
  max_train_batch_size: 32
  seed: 2024


# Trainer
trainer:
  log_period: 10
  save_period: 200
  validation_period: 200

  # loss_type: huber, loss_huber_thres: 120 in ls_da.yaml (real units, meters)
  huber_delta: 120.0
  target_vis_vmax: 30.0


# Training budget – equal total samples seen as sr_fm_refiner*/fm_refiner*
# (eff_bs=4 x 100000 iter = 400000 samples); at eff_bs=32, that's 12500 iter.
max_epoch: 1000
max_iter: 12500


eval:
  eval_metrics:
  - r2
  - mae
  - rmse

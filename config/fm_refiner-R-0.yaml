base_config:
- config/logging.yaml

wandb:
  project: marigold
  name: fm_refiner-R-0

# Dataset config – identical to fm_refiner-R-lumi.yaml/-3.yaml. This config
# is fm_refiner-R-lumi-3.yaml's noise mechanism retargeted to match RFMSR
# (github.com/Faze-Hsw/RFMSR) instead of InDI's own paper defaults — same
# asymmetric noise schedule shape (both are linear-in-t, zero at the clean
# end, max at the coarse end; RFMSR's t*sigma is InDI's own Eq.7 verbatim,
# ours is the (1-t)*sigma mirror of it because this codebase's t=1 is the
# clean end instead of InDI/RFMSR's t=0 — see fm_refiner-R-lumi-3.yaml's
# comments), but two things changed to match RFMSR specifically rather than
# InDI's paper:
#   1. noise_sigma/sample_sigma: 0.01 -> 1.0, matching RFMSR's config
#      (configs/train_rfmsr.yaml: "sigma: 1.0"). Confirmed RFMSR encodes
#      through the same pretrained SD2.1 VAE with the same 0.18215 scaling
#      factor we use (models/rfmsr.py's vae_encode()), so this is now a
#      directly comparable number in the same latent units — modulo RFMSR
#      encoding natural photos (what that VAE/scale was calibrated for) vs
#      this project encoding canopy-height maps, which may have different
#      latent statistics; not verified empirically here.
#   2. sample_noise_mode: "init_only" — RFMSR's infer_rfmsr.py injects noise
#      exactly ONCE (x = z_lr + sigma*randn(...)) before a purely
#      deterministic Euler ODE loop, unlike InDI's own Eq.10 (and this
#      project's fm_refiner-R-lumi-3.yaml / sr_finer_lumi's bridge_noise),
#      which inject fresh noise at every step (Euler-Maruyama SDE). RFMSR
#      does NOT reproduce InDI's per-step noisy sampling — this is RFMSR's
#      own simplification, not something inherited from InDI's paper.
dataset:
  input_dir: "/mnt/data/data/Landsat/eur_test2/2019"
  input_dir_hr: "/mnt/data/data/PlanetScope/EUR_crop_area_test2_ResizeMultimodal"
  output_dir: "/mnt/data/dataset/CHM_EUR_3m_area_test2_ls"

  file_type_input: "jp2"
  file_type_output: "tif"
  target_name: "canopy_height_"
  year: 2019

  selected_bands: [0, 1, 2]
  selected_percentile: ["p50"]

  selected_bands_hr: [2, 1, 0]

  use_input_minmax: True
  use_input_norm: False
  input_stats_file: "/mnt/data/dataset/CHM_EUR/LS_test2_statistics.json"

  use_input_hr_minmax: True
  use_input_hr_norm: False
  input_hr_stats_file: "/mnt/data/dataset/CHM_EUR/PS_test2_statistics.json"

  use_target_minmax: True
  use_target_norm: False
  target_stats_file: "/mnt/data/dataset/CHM_EUR/EUR_CHM_test_statistics.json"

  scale_input_to_neg1_1: True
  scale_input_hr_to_neg1_1: True
  scale_target_to_neg1_1: True

  patch_sizes: [240, 480]
  num_patches_per_tile: 300000

  target_range_edges: [0, 5, 10, 15, 20, 25, 30]
  num_patches_per_target_range: 500

  tile_emphasis: []
  min_valid_ratio: 0.1
  train_split: 0.6
  val_split: 0.2
  test_split: 0.2
  split_seed: 42

  workers: 6
  patch_coord_path: "/mnt/data/dataset/CHM_EUR_marigold/train_patch_coord/save_20260609.pkl"

  correlation_cleaning: False
  unit_scale_ratio: 1


# fm_refiner-R-0: single-GPU port of fm_refiner-D-lumi-0 (local /mnt/data paths). A from-scratch DiT-B refiner with OminiControl-style condition injection.
# Same data / CHMv2 coarse model / flow + noise schedule (sigma=1.0, init_only) / PS dropout + null PS
# as fm_refiner-R-lumi-5 and -11..-13; only the backbone and its optimisation recipe differ.
#   * backbone "dit_omini" (depthfm/dit_control.py: DiTOminiBackbone + DiTVAECondEncoder):
#       - DiT-B (12 blocks, hidden 768, 12 heads, patch 2), RANDOM init: Xavier for linear/patch-embed
#         layers, adaLN-Zero (block gates and output layer start at exactly 0);
#       - the condition images [Landsat, PS-or-null] are encoded by the frozen SD2.1 VAE (posterior
#         MEAN * 0.18215, same as the GT / coarse latents), patch-embedded (+ learned type embedding)
#         into tokens, concatenated to the latent tokens ([X; C_landsat; C_ps]) and attended jointly
#         in every block with shared weights; condition tokens reuse the latent tokens' 2D RoPE
#         positions (OminiControl, arXiv 2411.15098, "aligned" case); only X feeds the output head;
#       - the timestep is the same integer 0..999 the UNet gets; adaLN (time only) replaces the empty
#         text embedding; no cross-attention.
#   * optimisation: AdamW lr 1e-4 (original DiT), weight decay 0 (DiT / DiT-SR / RFMSR), 100 warmup
#     steps + cosine, grad-clip 1.0 (train script). NOT -11..-13's 4e-5 / 4e-4 (those were
#     fine-tuning-UNet numbers) and weight decay 1e-2.
#   * budget (single-GPU port of fm_refiner-D-lumi-0): D-lumi-0 trained 3125 steps at real batch 128
#     (64 GPUs x 2) = 400k samples. Here: real batch 32 (micro-batch 8 x 4 accumulation) x 12500 steps
#     = 400k samples, same total samples; scale_steps_by_batch False so max_iter / periods are real
#     optimizer steps. Warmup 250 (~2% of steps) instead of 100.
#   * NOT included yet: EMA of the weights (the FMRefiner training path has none), see the
#     hand-over notes.

# Model paths
model:
  sd_pretrained_path: "/mnt/data/model/marigold/stable-diffusion-2"   # only the frozen VAE is used

  backbone: "dit_omini"
  dit:
    patch_size: 2       # 30x30 / 60x60 latents -> 15x15 / 30x30 latent tokens (+ the same number per condition)
    hidden_size: 768
    depth: 12
    num_heads: 12
    mlp_ratio: 4.0

  dav2_pretrained_path: "/mnt/data/model/CHM_EUR/ls_da_model_r2.pth"
  dav2_backbone: "depth-anything/Depth-Anything-V2-Base-hf"
  dav2_out_in_scale_factor: 4

  # Coarse model switch: "dav2" (dav2_* keys above) or "chmv2" (keys below).
  coarse_model: "chmv2"
  chmv2_model_id: "/home/tree/.cache/huggingface/hub/models--facebook--dinov3-vitl16-chmv2-dpt-head/snapshots/37130c851a3cf6720f974490707059f5edaeed4e"
  chmv2_ckpt_path: "/mnt/data/model/CHM_EUR/baseline_chmv2/best.pth"
  chmv2_out_in_scale_factor: 4   # must match baseline_chmv2-lumi.yaml


# Optimizer: lr_unet applies to the DiT backbone, lr_controlnet to the condition encoder
# (patch embeddings + type embeddings of the condition tokens).
optimizer:
  lr_unet: 1.0e-04
  lr_controlnet: 1.0e-04
  weight_decay: 0.0


# LR scheduler (cosine annealing after a linear warmup)
lr_scheduler:
  eta_min: 1.0e-07
  warmup_steps: 250     # optimizer steps after the [scale] adjustment (3125 total with 64 GPUs), as -11..-14


# Dataloader: real batch = max_train_batch_size x world_size (2 x 64 = 128 on the standard 8-node job).
dataloader:
  effective_batch_size: 32   # 8 micro-batches x 4 accumulation steps
  max_train_batch_size: 8
  seed: 2024


# Trainer
trainer:
  use_controlnet: True    # enables the condition path (here: the VAE condition encoder)
  controlnet_cond_mode: "landsat_ps"
  ps_dropout_p: 0.3       # probability of replacing PS with the null PS (a constant image) per sample
  log_period: 10
  save_period: 250
  validation_period: 250

  # velocity_parameterization left at its default "fixed" (not set here) —
  # noise_sigma/sample_sigma are only implemented for "fixed".
  # RFMSR's noise strength, same as -5/-11..-13:
  #   z_t = (1-t)*z_coarse + t*z_gt + (1-t)*noise_sigma*eps
  #   v_target = (z_gt - z_coarse) - noise_sigma*eps
  noise_sigma: 1.0
  sample_sigma: 1.0
  # RFMSR-style: inject sample_sigma*eps once, then a pure deterministic Euler ODE.
  sample_noise_mode: init_only


# Validation / inference
validation:
  # Periodic: 4 Euler steps x 1 draw. Final full pass on best.pth: 10 steps x 5 draws (as -5).
  n_steps: 4
  ensemble_size: 1
  final_n_steps: 10
  final_ensemble_size: 5


# Training budget – unchanged from fm_refiner-R-lumi.yaml (rescaled by the train script: see header).
max_epoch: 1000
max_iter: 100000
scale_steps_by_batch: False


# Eval metrics logged during validation
eval:
  eval_metrics:
  - r2
  - mae
  - rmse

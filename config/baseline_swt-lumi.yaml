base_config:
- config/logging.yaml

wandb:
  project: marigold
  name: baseline_swt-lumi

# Multi-GPU (LUMI) port of baseline_swt_reg.yaml (sr_finer branch). Same
# dataset / patch split / model / losses; paths moved to /flash, and the batch
# size / LRs rescaled for 64 GPUs (see dataloader: and optimizer: below).

# Dataset config – same input_dir/output_dir/patch_coord as sr_fm_refiner_v5*-lumi
# so this baseline trains/validates on the exact same patches. 3-band (p50)
# input, matching the current SR experiments.
dataset:
  input_dir: "/flash/project_465002934/data/Landsat/eur_test2/2019"
  input_dir_hr: "/flash/project_465002934/data/EUR_crop_area_test2_ResizeMultimodal"
  output_dir: "/flash/project_465002934/dataset/CHM_EUR_3m_area_test2_ls"

  file_type_input: "jp2"
  file_type_output: "tif"
  target_name: "canopy_height_"
  year: 2019

  selected_bands: [0, 1, 2]
  selected_percentile: ["p50"]
  selected_bands_hr: [2, 1, 0]

  use_input_minmax: True
  use_input_norm: False
  input_stats_file: "/flash/project_465002934/dataset/CHM_EUR_marigold/LS_test2_statistics.json"

  use_input_hr_minmax: True
  use_input_hr_norm: False
  input_hr_stats_file: "/flash/project_465002934/dataset/CHM_EUR_marigold/PS_test2_statistics.json"

  # net_reg predicts raw canopy height (meters) directly, matching
  # SR4IR/base1_v1.yaml (normalize_target=False, minmax_target=False).
  use_target_minmax: False
  use_target_norm: False
  target_stats_file: "/flash/project_465002934/dataset/CHM_EUR_marigold/EUR_CHM_test_statistics.json"

  scale_input_to_neg1_1: True
  scale_input_hr_to_neg1_1: True
  scale_target_to_neg1_1: False

  patch_sizes: [240, 480]
  num_patches_per_tile: 300000

  target_range_edges: [0, 5, 10, 15, 20, 25, 30]
  num_patches_per_target_range: 500

  tile_emphasis: []
  min_valid_ratio: 0.1
  train_split: 0.6
  val_split: 0.2
  test_split: 0.2
  split_seed: 42

  workers: 6
  # Same patch_coord as sr_fm_refiner_v5*-lumi → identical train/val/test split.
  patch_coord_path: "/flash/project_465002934/dataset/CHM_EUR_marigold/train_patch_coord_marigold/save_20260609_resolved.pkl"

  correlation_cleaning: False
  unit_scale_ratio: 1


# Model paths
model:
  # SwinIR pretrained weights (DIV2K classical SR, 4x upscale) – same as
  # sr_fm_refiner_v5*-lumi / SR4IR/base1_v1.yaml's path:network_sr.
  sr_pretrained_path: "/flash/project_465002934/model/001_classicalSR_DIV2K_s48w8_SwinIR-M_x4.pth"
  sr_pretrained_key: "params"

  # net_reg: CHMv2 (DINOv3 ViT-L encoder + DPT neck/head), same local snapshot
  # and freeze recipe as baseline_chmv2-lumi.yaml: encoder frozen, only the
  # neck + head train. Weights come from this pretrained snapshot (not from the
  # baseline_chmv2 run). No upsample head: the SR module already outputs the
  # label resolution, so CHMv2 runs at 1x (out_in_scale_factor is fixed to 1 in
  # train_baseline_swt_reg.py). Input normalization uses the PS statistics
  # (dataset.input_hr_stats_file), since the input is the SR output.
  chmv2_model_id: "/flash/project_465002934/model/models--facebook--dinov3-vitl16-chmv2-dpt-head/snapshots/37130c851a3cf6720f974490707059f5edaeed4e"
  pretrained: True
  freeze_backbone: True


# SR module architecture – identical to SR4IR/base1_v1.yaml's network_sr block
sr_module:
  in_chans: 3
  out_chans: 3
  upscale: 4
  img_size: 48
  window_size: 8
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2.0
  upsampler: pixelshuffle
  resi_connection: 1conv


# SwT (SR with Task, joint training) losses. Single joint step: SR and
# net_reg (neck+head) are updated together from
#   L = pixel_weight * L1(img_sr, real_ps) + task_weight * Huber(net_reg(img_sr), H_gt)
# The task-loss gradient flows back into net_sr. No TDP loss, no warmup, no
# alternate training (those are what distinguish SR4IR from SwT).
sr_loss:
  pixel_weight: 1.0   # L1(img_sr, real_ps)
  task_weight: 1.0    # Huber(net_reg(img_sr), H_gt)


# Optimizers – aligned with sr_fm_refiner_v12-lumi.yaml
#
# lr_sr is v12-lumi's lr_sr (8e-4). lr_reg / weight_decay_reg are
# baseline_chmv2-lumi.yaml's (same CHMv2 head, same real batch of 128), since
# v12-lumi has no CHMv2-head LR of its own.
optimizer:
  lr_sr: 8.0e-04
  weight_decay_sr: 0.0

  lr_reg: 4.0e-04
  weight_decay_reg: 3.0e-04


# LR scheduler (cosine annealing, shared T_max = max_iter) – eta_min as in
# v12-lumi, for both SR and reg.
lr_scheduler:
  eta_min_sr: 1.0e-07
  eta_min_reg: 1.0e-07


# Dataloader – same as v12-lumi: real batch = max_train_batch_size x 64 ranks
# = 128 per optimizer step (world_size=64 is fixed by --nodes/--ntasks-per-node
# in train_baseline_swt_reg.sh; train_baseline_swt_reg.py logs this line at
# startup).
dataloader:
  effective_batch_size: 2
  max_train_batch_size: 2
  seed: 2024
  # Off on purpose: deterministic MIOpen convs make CHMv2's backward ~95x slower
  # here (see train_baseline_swt_reg.py). Seeds are still fixed.
  cudnn_deterministic: False


# Trainer
trainer:
  log_period: 10
  save_period: 1000
  validation_period: 1000

  # huber_hr_opt.delta in base1_v1.yaml (real units, meters)
  huber_delta: 1.0
  target_vis_vmax: 30.0


# Training budget – same max_iter as v12-lumi. The runtime scaling in
# train_baseline_swt_reg.py (identical formula to train_sr_fm_refiner.py)
# divides max_iter and the log/save/validation periods by
# (accumulation_steps x world_size) // 4 = 16, i.e. 3125 real steps of batch 128.
# (= 400k samples, the same total as baseline_swt_reg.yaml: 100000 x batch 4).
max_epoch: 1000
max_iter: 50000


eval:
  eval_metrics:
  - r2
  - mae
  - rmse

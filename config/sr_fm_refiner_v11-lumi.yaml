base_config:
- config/logging.yaml

wandb:
  project: marigold
  name: sr_fm_refiner_v11-lumi

# Dataset config – same as sr_fm_refiner_v5-R3-lumi.yaml
dataset:
  input_dir: "/flash/project_465002934/data/Landsat/eur_test2/2019"
  input_dir_hr: "/flash/project_465002934/data/EUR_crop_area_test2_ResizeMultimodal"
  output_dir: "/flash/project_465002934/dataset/CHM_EUR_3m_area_test2_ls"

  file_type_input: "jp2"
  file_type_output: "tif"
  target_name: "canopy_height_"
  year: 2019

  selected_bands: [0, 1, 2]
  selected_percentile: ["p50"]

  selected_bands_hr: [2, 1, 0]

  use_input_minmax: True
  use_input_norm: False
  input_stats_file: "/flash/project_465002934/dataset/CHM_EUR_marigold/LS_test2_statistics.json"

  use_input_hr_minmax: True
  use_input_hr_norm: False
  input_hr_stats_file: "/flash/project_465002934/dataset/CHM_EUR_marigold/PS_test2_statistics.json"

  use_target_minmax: True
  use_target_norm: False
  target_stats_file: "/flash/project_465002934/dataset/CHM_EUR_marigold/EUR_CHM_test_statistics.json"

  scale_input_to_neg1_1: True
  scale_input_hr_to_neg1_1: True
  scale_target_to_neg1_1: True

  patch_sizes: [240, 480]
  num_patches_per_tile: 300000

  target_range_edges: [0, 5, 10, 15, 20, 25, 30]
  num_patches_per_target_range: 500

  tile_emphasis: []
  min_valid_ratio: 0.1
  train_split: 0.6
  val_split: 0.2
  test_split: 0.2
  split_seed: 42

  workers: 6
  patch_coord_path: "/flash/project_465002934/dataset/CHM_EUR_marigold/train_patch_coord_marigold/save_20260609_resolved.pkl"

  correlation_cleaning: False
  unit_scale_ratio: 1


# Model paths
model:
  sd_pretrained_path: "/flash/project_465002934/model/stable-diffusion-2"
  dav2_pretrained_path: "/flash/project_465002934/model/ls_da_model_r2.pth"
  dav2_backbone: "depth-anything/Depth-Anything-V2-Base-hf"
  dav2_out_in_scale_factor: 4

  # SwinIR pretrained weights (DIV2K classical SR, 4× upscale).
  # Set to null to train SR from scratch.
  sr_pretrained_path: "/flash/project_465002934/model/001_classicalSR_DIV2K_s48w8_SwinIR-M_x4.pth"
  sr_pretrained_key: "params"   # key inside the .pth dict


# SR module architecture – mirrors SR4IR options/reg/base1_v2.yaml network_sr block
sr_module:
  in_chans: 3
  out_chans: 3
  upscale: 4
  img_size: 48
  window_size: 8
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2.0
  upsampler: pixelshuffle
  resi_connection: 1conv


# SR training losses (Phase 1)
#
# tdp_hook/tdp_weight ported from config/sr_fm_refiner_v2-R2.yaml (sr_finer
# branch), NOT this file's own lineage (v5-R3-lumi used
# "controlnet.cond_embedding"). "unet.up_blocks.3" requires a full
# ControlNet+UNet forward with a properly t-sampled, interpolated z_t (see
# script/depth/train_sr_fm_refiner.py::_sr_step, which was ported from the
# sr_finer branch's version — this lumi branch's own copy previously used a
# fixed t=0.5 + z_coarse-as-sample shortcut that fed the network an
# (sample, t) pair it never sees during real training/inference).
sr_loss:
  pixel_weight: 1.0   # L1(pseudo_ps, real_ps)
  tdp_weight: 1.0      # L1 on unet.up_blocks[3] features (pseudo vs real)
  tdp_hook: "unet.up_blocks.3"
  # tdp_t_min/tdp_t_max left at their code defaults (0.0/1.0, full range) —
  # not overridden here, matching v2-R2.


# Alternate training schedule


# Optimizers – lr_unet/lr_controlnet/weight_decay matched to
# fm_refiner-R-lumi-4.yaml (finer_lumi branch) exactly, per its own
# real-batch-128 scaling rationale (see that file's optimizer: comment) —
# NOT this branch's own sr_fm_refiner_v5-R3-lumi.yaml lineage (which was
# tuned for real-batch-64, 2e-05 base x4). lr_sr/weight_decay_sr have no
# equivalent in fm_refiner-R-lumi-4 (no SR module there) — left unchanged.
optimizer:
  lr_unet: 4.0e-05        # matches fm_refiner-R-lumi-4.yaml
  lr_controlnet: 4.0e-04  # matches fm_refiner-R-lumi-4.yaml
  weight_decay: 1.0e-02

  lr_sr: 8.0e-04           # no fm_refiner-R-lumi-4 equivalent — unchanged
  weight_decay_sr: 0.0


# LR scheduler (cosine annealing, shared T_max = max_iter)
lr_scheduler:
  eta_min: 1.0e-07


# Dataloader – batch size matched to fm_refiner-R-lumi-4.yaml (real batch
# max_train_batch_size x 64 ranks = 128, same as that config — NOT this
# branch's own v5-R3-lumi lineage, which used max_train_batch_size=1 (real
# batch 64) to match the LR scaling above).
dataloader:
  effective_batch_size: 2
  max_train_batch_size: 2
  seed: 2024


# Trainer
trainer:
  log_period: 10
  save_period: 1000
  validation_period: 1000

  # PS source probabilities per batch (mutually exclusive) — matches
  # config/sr_fm_refiner_v2-R2.yaml: main FM step always uses pseudo-PS,
  # never drops to null, never uses real PS (real PS is only seen by the
  # TDP loss's "real" branch in _sr_step).
  p_null_drop: 0.0
  p_pseudo_ps: 1.0

  # InDI-style asymmetric noise, ported from fm_refiner-R-lumi-4 on the
  # finer_lumi branch (NOT this branch's own bridge_sigma mechanism — the
  # two are mutually exclusive, see depthfm/fm_refiner.py FMRefiner.__init__).
  # h(t) = (1-t)*noise_sigma, zero at the clean z_gt end (t=1), max at the
  # coarse z_coarse end (t=0):
  #   z_t = (1-t)*z_coarse + t*z_gt + (1-t)*noise_sigma*eps
  #   v_target = (z_gt - z_coarse) - noise_sigma*eps
  # The same noise is now also mirrored into the TDP step's z_t (see
  # _sr_step's noise_sigma correction) so the shared UNet/ControlNet isn't
  # fed an out-of-distribution clean z_t during the TDP forward passes.
  bridge_sigma: 0.0   # disabled — mutually exclusive with noise_sigma below
  noise_sigma: 1.0
  sample_sigma: 1.0
  sample_noise_mode: init_only   # RFMSR-style: noise injected once, then pure ODE

  # Steps before TDP loss is activated (pixel-only warmup)
  warmup_sr_steps: 200

  concat_landsat_hr: True


# Validation / inference
validation:
  # sample_noise_mode=init_only injects noise once regardless of step count
  # (unlike the old bridge_sigma+sde-style setup, where total injected noise
  # scales with n_steps — see fm_refiner-R-lumi-3.yaml on finer_lumi for that
  # derivation). 10 here matches fm_refiner-R-lumi-4, not chosen for a
  # noise-specific reason — n_steps mainly affects ODE discretization
  # accuracy in this mode.
  n_steps: 10
  method: euler
  # True  → validation uses SR pseudo-PS via refine_with_ps()
  # False → validation uses null PS via refine() (baseline comparison)
  use_sr_pseudo_ps: True
  # Matches fm_refiner-R-lumi-4's ensemble_size: 5 (same concept, this
  # branch's own naming) — averages n_avg independent stochastic refine()
  # draws before computing metrics, trading detail for point-accuracy (see
  # fm_refiner-R-lumi-3.yaml's ensemble_size comment on finer_lumi for the
  # perception-distortion tradeoff this involves).
  n_avg: 5


# Training budget – max_iter matched to fm_refiner-R-lumi-4.yaml (both this
# script's total_scale block and train_fm_refiner.py's use the same
# accumulation_steps x world_size / reference_accum_steps scaling, and batch
# settings above now match -4 exactly, so this keeps the same total training
# data volume as -4 — NOT this branch's own v5-R3-lumi lineage, which used
# 100000 at half the real batch size).
max_epoch: 1000
max_iter: 50000


eval:
  eval_metrics:
  - r2
  - mae
  - rmse

base_config:
- config/logging.yaml
- config/wandb.yaml
- config/model_sdv2.yaml

dataset:
  input_dir: "/mnt/data/data/PlanetScope/EUR_crop_area_test2_resize" # '/mnt/ssdc/china/LC_comb2023/' #"/nfs/Landsat/south_china/2023/"
  output_dir:  "/mnt/data/dataset/CHM_EUR_3m_area_test2" # "/mnt/ssdc/china/chm_reference_2nd/GF2_CH_5m_same_dim/"
  file_type_input: "jp2"
  file_type_output: "tif"
  target_name: "canopy_height_" # strict formating! output file has names like "canopy_height_110,98.tif"; this is used to separate tile id from the target name
  year: 2019
  # selected_bands: [0, 1, 2, 3, 4, 5, 6]  # Which bands to select from input (0-indexed), for landsat
  selected_bands: [2, 1, 0, 3] # planet blue green red, nir
  selected_percentile: ["p50"] # which will not be used for planetscope
  use_global_minmax: True # gb norm for input image to [-1, 1]
  use_global_norm: False # global mean std norm
  use_local_norm: False # patch level norm
  use_geo_location: False # set to true to allow separate location encoder
  globalnorm_stats_file: "/mnt/data/dataset/CHM_EUR/PS_test2_statistics.json" # json file storing statistics for each year of landsat
  # targetnorm_stats_file: "/mnt/data/dataset/CHM_EUR/EUR_CHM_test_statistics.json" # json file storing statistics for each year of target

  # multimodal
  input_multimodal: False
  input_dir_m2: "/mnt/Planet/PlanetScope/Mosaics/China/2019/" # multimodal input
  file_type_m2: 'jp2'
  selected_bands_m2: [2, 1, 0, 3] # planet blue green red, nir

  # patch_sizes: [192, 384] #based on output size!
  # patch_sizes: [120, 240] # for planetscope，input patch size is [200, 400]]
  # patch_sizes: [128, 256] # for unet planetscope
  # patch_sizes: [140, 280] # for depth anything planetscope
  patch_sizes: [240, 480] # for marigold PS_eur

  num_patches_per_tile: 100000 # in stratified sampling, this is the max sampling attempts

  # target_range_edges: [0, 50, 100, 150, 200, 250, 300, 1000] # stratified sampling, target value edges (defined by the max value of each patch) (sampling equal no. patches in each group)
  target_range_edges: [0, 5, 10, 15, 20, 25, 30, 40]
  
  num_patches_per_target_range: 200 # stratified sampling, e.g., attempting to get 200 patches per range, where the range group is defined by the max/median/... value of the patch
  
  # tile_emphasis: ['121,30', '120,28', '120,29', '112,24', '112,25', '110,26', '109,27', '112,27', '113,25', '122,26'] # sample 10 times more for these tiles
  # tile_emphasis: ['121,30', '120,28', '120,29', '112,24', '112,25', '110,26', '109,27', '112,27', '113,25']
  tile_emphasis: [] 

  tile_lon_range: [4.4915, 14.3730] # range of lon in EUR test, used to normalize location input
  tile_lat_range: [44.0174, 53.8989] # range of lat in EUR test, used to normalize location input
  

  # tile_lon_range: [97.0179, 98.8147] 
  # tile_lat_range: [23.3562, 26.0498]

  min_valid_ratio: 0.1
  train_split: 0.6
  val_split: 0.2
  test_split: 0.2
  run_test: False # testing involves long metric calculating steps, not necessary if not for reporting model metrics
  split_seed: 42
  efficient_batching: True
  normalize_target: False # using target global mean and std
  minmax_target: False # scale target to [-1, 1] based on global min max
  workers: 6
  patch_coord_path: "/mnt/data/dataset/CHM_EUR_marigold/train_patch_coord/save_20260317.pkl" # if None, generate new patch coordinates
  # Data cleaning configuration
  nodata_cleaning: False # remove patches with high no data ratio
  correlation_cleaning: False # spearman r between ndvi and target, True for chm, False for height
  unit_scale_ratio: 1 # multiply the target by this value to get into regular units


pipeline:
  name: MarigoldDepthPipeline
  kwargs:
    scale_invariant: true
    shift_invariant: true
    default_denoising_steps: 4
    default_processing_resolution: 768

depth_normalization:
  type: scale_shift_depth
  clip: true
  norm_min: -1.0
  norm_max: 1.0
  min_max_quantile: 0.02

augmentation:
  lr_flip_p: 0.5

dataloader:
  num_workers: 2
  effective_batch_size: 8
  max_train_batch_size: 2
  seed: 2024  # to ensure continuity when resuming from checkpoint

trainer:
  name: MarigoldDepthTrainer
  training_noise_scheduler:
    pretrained_path: stable-diffusion-2
  init_seed: 2024  # use null to train w/o seeding
  save_period: 50
  backup_period: 2000
  validation_period: 200
  visualization_period: 200

multi_res_noise:
  strength: 0.9
  annealed: true
  downscale_strategy: original

gt_depth_type: depth_raw_norm
gt_mask_type: False

max_epoch: 10000  # a large enough number
max_iter: 30000  # usually converges at around 20k

optimizer:
  name: Adam

loss:
  # name: mse_loss
  # kwargs:
  #   reduction: mean

  name: huber_loss
  kwargs:
    reduction: mean
    delta: 1.0

lr: 3.0e-05
lr_scheduler:
  name: IterExponential
  kwargs:
    total_iter: 25000
    final_ratio: 0.01
    warmup_steps: 100

# Light setting for the in-training validation and visualization
validation:
  denoising_steps: 1
  ensemble_size: 1
  processing_res: 0
  match_input_res: false # 如果到时候将patch size变成8的倍数了，那就将这个设置改回成 false，直接让模型输出和输入同样的分辨率就好了
  resample_method: bilinear
  main_val_metric: abs_relative_difference
  main_val_metric_goal: minimize
  init_seed: 2024


eval:
  alignment: least_square
  align_max_res: null
  eval_metrics:
  - abs_relative_difference
  - squared_relative_difference
  - rmse_linear
  - rmse_log
  - log10
  - i_rmse
  - silog_rmse
  - r2

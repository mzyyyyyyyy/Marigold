# Large-scale inference config for sr_fm_refiner_v5 on Landsat EUR test tiles
# Data mirrors ls_mrg_pred.yaml; model mirrors sr_fm_refiner_v5.yaml

data:
  input_dir: "/mnt/data/data/Landsat/eur_test2_map/2019"
  year: 2019
  output_dir: "/mnt/data/result/chm/EUR_sr_fm_refiner"
  output_suffix: "chm"
  file_type: "jp2"
  selected_bands: [0, 1, 2]          # RGB only (sr_fm_refiner_v5 uses 3-band input)
  selected_percentile: ["p50"]
  selected_resolution: ""
  exclude_list: ["original_data", "lowres", "30m"]
  exclude_strings: ["lowres", "1000m", "100m", "30m"]
  selected_test_tile: []
  grid_id_file: "/mnt/data/dataset/CHM_EUR/EUR_test_grids_1deg_lc.geojson"

  use_gb_minmax: True
  globalnorm_stats_file: "/mnt/data/dataset/CHM_EUR/LS_test2_statistics.json"

  patch_size: 120        # LR patch size; output will be 4× = 480 px
  out_scale: 4.0         # sr_fm_refiner upscales ×4 (SR + DAv2 both ×4)
  stride: 16             # stride in LR pixels (= 64 px in output space)

model:
  # sr_fm_refiner_v5 checkpoint
  ckpt_path: "/home/tree/Projects/Marigold/output/sr_fm_refiner_v5/checkpoint/best.pth"
  config_path: "/home/tree/Projects/Marigold/output/sr_fm_refiner_v5/config.yaml"

  # DAv2 weights (same as training)
  dav2_pretrained_path: "/mnt/data/model/CHM_EUR/ls_da_model_r2.pth"
  dav2_backbone: "depth-anything/Depth-Anything-V2-Base-hf"
  dav2_out_in_scale_factor: 4

  # Target stats for coarse normalisation
  target_stats_file: "/mnt/data/dataset/CHM_EUR/EUR_CHM_test_statistics.json"

  n_average: 5           # stochastic averaging runs
  bridge_sigma: 0.5      # must match training; drives stochasticity
  n_steps: 4
  method: "euler"

prediction:
  batch_size: 1          # one LR patch at a time (model is memory-heavy)
  operator: "blend"
  file_type: "tif"
  data_type: "float32"

base_config:
- config/logging.yaml
- config/model_sdv2.yaml

wandb:
  # entity: your_entity
  project: marigold
  name: ps_mrg_mm_v0

# rgb: [-1, 1], depth: [-1, 1].
dataset:
  # LR input (e.g. Landsat)
  input_dir: "/mnt/data/data/Landsat/eur_test2/2019"
  # HR input (e.g. PlanetScope)
  input_dir_hr: "/mnt/data/data/PlanetScope/EUR_crop_area_test2_ResizeMultimodal"
  output_dir: "/mnt/data/dataset/CHM_EUR_3m_area_test2_ls"

  file_type_input: "tif"
  file_type_output: "tif"
  target_name: "canopy_height_"
  year: 2019

  # LR input band selection
  selected_bands: [0, 1, 2]  # Landsat bands (0-indexed)
  selected_percentile: ["p50"]

  # HR input band selection
  selected_bands_hr: [2, 1, 0]  # PlanetScope: blue, green, red, nir

  # LR input normalization
  use_input_minmax: True       # scale to [0, 1] then optionally to [-1, 1]
  use_input_norm: False        # global mean-std normalization after minmax
  input_stats_file: "/mnt/data/dataset/CHM_EUR/LS_test2_statistics.json"

  # HR input normalization
  use_input_hr_minmax: True
  use_input_hr_norm: False
  input_hr_stats_file: "/mnt/data/dataset/CHM_EUR/PS_test2_statistics.json"

  # Target normalization
  use_target_minmax: True      # scale target to [-1, 1] based on global p1/p99
  use_target_norm: False       # global mean-std normalization
  target_stats_file: "/mnt/data/dataset/CHM_EUR/EUR_CHM_test_statistics.json"

  # Final range scaling (applied after normalization)
  scale_input_to_neg1_1: True     # map [0,1] -> [-1,1] for LR input
  scale_input_hr_to_neg1_1: True   # map [0,1] -> [-1,1] for HR input
  scale_target_to_neg1_1: True     # map [0,1] -> [-1,1] for target

  patch_sizes: [240, 480]     # output patch sizes (HR resolution)

  num_patches_per_tile: 100000  # max sampling attempts per tile

  target_range_edges: [0, 5, 10, 15, 20, 25, 30, 40]
  num_patches_per_target_range: 200

  tile_emphasis: []

  min_valid_ratio: 0.1
  train_split: 0.6
  val_split: 0.2
  test_split: 0.2
  run_test: False
  split_seed: 42

  workers: 6
  patch_coord_path: "/mnt/data/dataset/CHM_EUR_marigold/train_patch_coord/save_20260608.pkl"

  correlation_cleaning: False  # spearman NDVI-CHM filter
  unit_scale_ratio: 1          # multiply target to get regular units


pipeline:
  name: MarigoldDepthPipeline
  kwargs:
    scale_invariant: true
    shift_invariant: true
    default_denoising_steps: 4
    default_processing_resolution: 768

depth_normalization:
  type: scale_shift_depth
  clip: true
  norm_min: -1.0
  norm_max: 1.0
  min_max_quantile: 0.02

augmentation:
  lr_flip_p: 0.5

dataloader:
  num_workers: 2
  effective_batch_size: 8
  max_train_batch_size: 2
  seed: 2024

trainer:
  name: MarigoldDepthTrainer
  training_noise_scheduler:
    pretrained_path: stable-diffusion-2
  init_seed: 2024
  save_period: 50
  backup_period: 2000
  validation_period: 200
  visualization_period: 200

multi_res_noise:
  strength: 0.9
  annealed: true
  downscale_strategy: original

gt_depth_type: depth_raw_norm
gt_mask_type: False

max_epoch: 10000
max_iter: 30000

optimizer:
  name: Adam

loss:
  name: huber_loss
  kwargs:
    reduction: mean
    delta: 1.0

lr: 3.0e-05
lr_scheduler:
  name: IterExponential
  kwargs:
    total_iter: 25000
    final_ratio: 0.01
    warmup_steps: 100

validation:
  denoising_steps: 1
  ensemble_size: 1
  processing_res: 0
  match_input_res: false
  resample_method: bilinear
  main_val_metric: r2
  main_val_metric_goal: maximize
  init_seed: 2024

eval:
  alignment: least_square
  align_max_res: null
  eval_metrics:
  - rmse_linear
  - r2
